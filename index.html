window.addEventListener('mousemove',e=>{if(!mouseDrag||!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.hypot(dx,dy)>5)dragged=true;if(gesture==='nav'){viewer.scrollLeft=start.scrollX-dx;viewer.scrollTop=start.scrollY-dy}else if(gesture==='edit'&&selectedPoint&&dragged){moveSelected(e.clientX,e.clientY);editDirty=true}});

$('cal').onclick=()=>{setGesture('tap');const p=current();if(!p)return;if(p.cal.length===2&&!confirm('기준점 두 개를 다시 선택할까요? 기존 경로는 유지됩니다.'))return;p.cal=[];path=[];setMode('cal');persist();render()};$('apply').onclick=()=>{const p=current();if(!p)return;const v=Number($('distance').value);if(p.cal.length!==2||!(v>0)||!Number.isFinite(v)){msg('기준점 2개를 찍고 0보다 큰 실제 거리를 입력하세요.');return}p.distance=v;p.unit=$('unit').value;persist();setMode('measure');render();msg('기준 거리 적용 완료: '+v+' '+p.unit)};
$('measure').onclick=()=>{setGesture('tap');if(!factor(current())){msg('기준점 두 곳과 실제 거리를 먼저 설정하세요.');return}setMode('measure')};$('undo').onclick=()=>{const p=current();if(selectedPoint&&gesture==='edit'){const a=pointArray(selectedPoint);if(a&&a.length){a.splice(selectedPoint.index,1);if(selectedPoint.type!=='path')persist()}selectedPoint=null}else if(mode==='cal'){p.cal.pop();persist()}else path.pop();render()};$('clear').onclick=()=>{path=[];render()};$('finish').onclick=()=>{const p=current();if(!factor(p)||path.length<2){msg('기준 설정 후 경로에 점 2개 이상을 찍으세요.');return}const name=prompt('측정 기록 이름',`경로 ${p.records.length+1}`);if(name===null)return;p.records.push({name:name.trim()||`경로 ${p.records.length+1}`,points:path.map(x=>[...x]),color:colors[p.nextColor++%colors.length]});path=[];persist();render();msg('측정 경로가 자동 저장되었습니다.')};$('zoom').oninput=e=>setZoom(Number(e.target.value)/100);$('resetZoom').onclick=()=>{setZoom(1);viewer.scrollTo(0,0)};

// 90° 단위로 사진 픽셀과 모든 측정 좌표를 함께 회전합니다.
// 좌표 간 거리는 불변이므로 기준 거리와 측정값은 유지됩니다.
let rotating=false;
async function rotateProject(degrees,reset=false){
 const p=current();if(!p||rotating||!photo.complete||!photo.naturalWidth)return;
 const previous=((p.rotation||0)%360+360)%360;
 const turns=((reset?360-previous:degrees)%360+360)%360/90;
 if(!Number.isInteger(turns))return;
 if(turns===0){msg('이미 원래 방향입니다.');return}
 rotating=true;
 try{
  const w=photo.naturalWidth,h=photo.naturalHeight;
  const canvas=document.createElement('canvas');
  canvas.width=turns%2?h:w;canvas.height=turns%2?w:h;
  const ctx=canvas.getContext('2d');if(!ctx)throw Error('캔버스를 사용할 수 없습니다');
  if(turns===1){ctx.translate(h,0);ctx.rotate(Math.PI/2)}
  else if(turns===2){ctx.translate(w,h);ctx.rotate(Math.PI)}
  else if(turns===3){ctx.translate(0,w);ctx.rotate(3*Math.PI/2)}
  ctx.drawImage(photo,0,0,w,h);
  const rotatedImage=canvas.toDataURL('image/jpeg',0.96);
  const point=pt=>{const [x,y]=pt;if(turns===1)return [h-y,x];if(turns===2)return [w-x,h-y];return [y,w-x]};
  p.cal=p.cal.map(point);path=path.map(point);
  p.records.forEach(r=>{r.points=r.points.map(point)});
  p.image=rotatedImage;p.rotation=(previous+turns*90)%360;
  // 저장을 먼저 마친 뒤 화면을 다시 구성합니다.
  clearTimeout(saveTimer);await dbPut(p);
  choose(p.id);
  msg('도면과 측정점을 함께 회전했습니다. 기준 거리와 길이는 유지됩니다.');
 }catch(err){msg('회전 실패: '+err.message)}finally{rotating=false}
}
$('rotateLeft').onclick=()=>rotateProject(270);
$('rotateRight').onclick=()=>rotateProject(90);
$('rotate180').onclick=()=>rotateProject(180);
$('rotateReset').onclick=()=>rotateProject(0,true);

$('projects').onchange=e=>choose(e.target.value);$('new').onclick=()=>$('filePhoto').click();$('filePhoto').onchange=async e=>{const file=e.target.files[0];if(!file)return;if(!file.type.startsWith('image/')){alert('사진 파일을 선택하세요.');return}try{const image=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});const name=prompt('새 도면 이름',file.name.replace(/\.[^.]+$/,''));if(name===null)return;const p=project(name.trim()||file.name,image);await dbPut(p);projects.push(p);choose(p.id);msg('새 도면을 등록했습니다. 기준점 두 곳을 찍으세요.')}catch(err){alert('도면 등록 실패: '+err.message)}e.target.value=''};
$('rename').onclick=()=>{const p=current();if(!p)return;const name=prompt('도면 이름',p.name);if(name===null||!name.trim())return;p.name=name.trim();persist();refreshList()};$('remove').onclick=async()=>{const p=current();if(!p||!confirm('도면 사진과 모든 측정 기록을 삭제할까요? 백업하지 않았다면 복원할 수 없습니다.'))return;await dbDelete(p.id);projects=projects.filter(x=>x.id!==p.id);if(!projects.length){const q=project('예제 전기 도면',DEFAULT_IMAGE);await dbPut(q);projects.push(q)}choose(projects[0].id)};
async function download(content,name){const blob=new Blob([content],{type:'application/json'});const file=new File([blob],name,{type:'application/json'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'전기도면 측정기 전체 백업'});return true}catch(err){if(err.name==='AbortError')return false}}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);return true}
$('backup').onclick=async()=>{const saved=await download(JSON.stringify({type:'electrical-measure-pro',version:1,projects,activeId,exportedAt:new Date().toISOString()}),'전기도면_전체백업_'+new Date().toISOString().slice(0,10)+'.json');msg(saved?'백업 파일을 저장하거나 공유했습니다. 파일 앱에 안전하게 보관하세요.':'백업 공유를 취소했습니다.')};$('import').onclick=()=>$('fileBackup').click();$('fileBackup').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.type!=='electrical-measure-pro'||!Array.isArray(data.projects)||data.projects.length>200)throw Error('지원하지 않는 백업 형식');for(const p of data.projects){if(typeof p.name!=='string'||typeof p.image!=='string'||!p.image.startsWith('data:image/')||!Array.isArray(p.cal)||!Array.isArray(p.records)||p.records.length>20000||!p.cal.every(pt=>Array.isArray(pt)&&pt.length===2&&pt.every(Number.isFinite))||!p.records.every(r=>Array.isArray(r.points)&&r.points.every(pt=>Array.isArray(pt)&&pt.length===2&&pt.every(Number.isFinite))))throw Error('백업 데이터 오류')}if(!confirm('백업의 도면 '+data.projects.length+'개를 현재 목록에 추가할까요?'))return;for(const p of data.projects){p.id=uid();await dbPut(p);projects.push(p)}choose(projects[projects.length-1].id);msg('백업 도면을 복원했습니다.')}catch(err){alert('복원 실패: '+err.message)}e.target.value=''};
(async()=>{try{db=await openDB();projects=await dbAll();if(!projects.length){const p=project('예제 전기 도면',DEFAULT_IMAGE);await dbPut(p);projects=[p]}choose(projects[0].id);msg('도면을 선택한 뒤 기준점을 두 곳 찍으세요. 도면마다 기준 거리를 다르게 설정할 수 있습니다.')}catch(e){msg('기기 저장소 사용 불가: '+e.message+' · Safari에서 HTTPS 주소로 열어보세요.')}})();
</script><script>if('serviceWorker' in navigator && location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn));</script></body></html>
